<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual">
<meta name="theme-color" content="#0f9d58">
<title>চাঁদপুর কানেক্ট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0f9d58;--g2:#10c477;--gd:#087a45;--b:#1a73e8;--b2:#3d8bff;--bg:#e6f6ee;--t:#0d2a1e;--m:#5b7467}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;background:linear-gradient(180deg,#e6f6ee 0%,#f1f8ff 55%,#fff 100%) fixed;color:var(--t);padding-bottom:104px;overflow-x:hidden;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
/* ===== হিরো ===== */
.hero{position:relative;overflow:hidden;color:#fff;min-height:402px;border-radius:0 0 34px 34px;background:var(--sky);box-shadow:0 18px 40px rgba(10,80,70,.28)}
.hero[data-sky=dawn]{--sky:linear-gradient(180deg,#f77f5e 0%,#ffb98a 32%,#bfe6d2 64%,#76cbe4 100%)}
.hero[data-sky=day]{--sky:linear-gradient(180deg,#1b7fe0 0%,#3fa6ee 38%,#7dd5e8 70%,#bdf1de 100%)}
.hero[data-sky=dusk]{--sky:linear-gradient(180deg,#34479f 0%,#8a63c8 30%,#f08678 62%,#ffcf8a 100%)}
.hero[data-sky=night]{--sky:linear-gradient(180deg,#061741 0%,#0e3672 55%,#16707a 100%)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,35,45,.34),transparent 58%);z-index:2;pointer-events:none}
.scene{position:absolute;left:0;bottom:0;width:100%;height:252px;z-index:1}
.hero-in{position:relative;z-index:3;padding:18px 18px 0}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.22);animation:glow 3.2s ease-in-out infinite}
.logo svg{width:100%;height:100%}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.22)}50%{box-shadow:0 0 0 10px rgba(255,255,255,.1),0 8px 26px rgba(0,0,0,.28)}}
.brand h1{font-size:21px;font-weight:800;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.brand small{font-size:10px;letter-spacing:2.6px;opacity:.92}
.chip-btn{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:30px;padding:5px 12px 5px 5px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.chip-btn.in{padding:7px 13px}
.av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:700;font-size:14px}
.greet{margin-top:24px;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.greet .dt{font-size:12.5px;background:rgba(255,255,255,.2);border-radius:20px;padding:2px 11px}
.tagline{margin-top:8px;font-size:31px;line-height:1.22;font-weight:800;text-shadow:0 3px 16px rgba(0,0,0,.32)}
.tagline span{background:linear-gradient(90deg,#fff,#c9ffe5,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite;filter:drop-shadow(0 3px 10px rgba(0,0,0,.32))}
@keyframes shimmer{to{background-position:200% 0}}
.cloud{animation:drift 70s linear infinite}
.cloud.c2{animation-duration:105s;animation-delay:-45s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(500px)}}
.w1{animation:wv1 6s linear infinite}
.w2{animation:wv2 10s linear infinite reverse}
@keyframes wv1{to{transform:translateX(-100px)}}
@keyframes wv2{to{transform:translateX(-200px)}}
.boat{animation:cruise 50s linear infinite -17s}
@keyframes cruise{from{transform:translateX(-90px)}to{transform:translateX(480px)}}
.rock{transform-box:fill-box;transform-origin:50% 100%;animation:rock 3.4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-1.5px)}}
.hilsa{opacity:0;animation:leap 12s ease-in-out infinite 2s}
@keyframes leap{0%,58%{opacity:0;transform:translate(0,4px) rotate(-50deg)}60%{opacity:1;transform:translate(2px,0) rotate(-55deg)}69%{opacity:1;transform:translate(26px,-34px) rotate(-5deg)}78%{opacity:1;transform:translate(52px,-2px) rotate(48deg)}80%,100%{opacity:0;transform:translate(56px,6px) rotate(60deg)}}
.bird{animation:fly 30s linear infinite}
.bird.b2{animation-duration:42s;animation-delay:-14s}
.bird.b3{animation-duration:36s;animation-delay:-24s}
@keyframes fly{from{transform:translate(-30px,0)}to{transform:translate(440px,-16px)}}
.star{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.sun{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
/* ===== সার্চ ===== */
.search{position:relative;z-index:5;margin:-27px 16px 0;background:#fff;border-radius:20px;box-shadow:0 12px 32px rgba(10,90,60,.2),0 0 0 1px rgba(16,196,119,.14);display:flex;align-items:center;padding:0 16px;transition:.25s}
.search:focus-within{box-shadow:0 14px 36px rgba(26,115,232,.3),0 0 0 2px var(--b2);transform:translateY(-2px)}
.search input{flex:1;border:0;outline:0;padding:16px 8px;font:inherit;font-size:15px;background:transparent;min-width:0}
h2{font-size:18px;font-weight:700;margin:26px 18px 12px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:5px;height:20px;border-radius:4px;background:linear-gradient(var(--g2),var(--b))}
/* ===== দ্রুত সেবা, পরিসংখ্যান, সদস্য হওয়ার আমন্ত্রণ ===== */
.quick{display:flex;gap:12px;overflow-x:auto;padding:20px 16px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.q{flex:0 0 auto;width:66px;text-align:center;border:0;background:none;color:var(--t);text-decoration:none;animation:rise .5s backwards;animation-delay:calc(var(--i,0)*50ms)}
.q i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:25px;margin:0 auto 6px;background:#fff;box-shadow:0 6px 16px rgba(16,100,70,.14),inset 0 0 0 2px #d8efe3;transition:transform .2s}
.q:active i{transform:scale(.92)}
.q span{font-size:12px;font-weight:600;display:block}
.q.sos i{background:linear-gradient(135deg,#ff5a5a,#d32f2f);box-shadow:0 8px 18px rgba(211,47,47,.4);animation:sos 2.2s infinite}
@keyframes sos{0%{box-shadow:0 0 0 0 rgba(211,47,47,.5)}70%{box-shadow:0 0 0 14px rgba(211,47,47,0)}100%{box-shadow:0 0 0 0 rgba(211,47,47,0)}}
.ribbon{margin:16px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:20px;box-shadow:0 8px 22px rgba(16,100,70,.1);overflow:hidden}
.ribbon div{padding:12px 4px;text-align:center;position:relative}
.ribbon div+div::before{content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:#dcebe2}
.ribbon b{display:block;font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--g),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.ribbon span{font-size:11px;color:var(--m)}
.join{margin:16px 16px 0;border-radius:22px;padding:16px;background:linear-gradient(120deg,#0f9d58,#1a73e8);color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 12px 26px rgba(26,115,232,.3)}
.join b{display:block;font-size:16px}
.join small{opacity:.94;font-size:12.5px;line-height:1.5;display:block}
.join button{margin-left:auto;flex:none;border:0;background:#fff;color:var(--gd);border-radius:14px;padding:10px 15px;font-weight:700;font-size:13.5px}
/* ===== কার্ড ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 16px}
.card{position:relative;overflow:hidden;background:#fff;border-radius:22px;padding:18px 10px 14px;text-align:center;border:1px solid rgba(16,196,119,.1);box-shadow:0 8px 22px rgba(16,100,70,.09);transition:transform .2s;animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.card::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-48%;height:65%;background:radial-gradient(closest-side,rgba(16,196,119,.14),transparent);pointer-events:none}
.card:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.96)}}
.ico{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-size:29px;margin:0 auto 9px;background:var(--c,#e6f4ec);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04),0 4px 10px rgba(0,0,0,.06)}
.card b,.card span{display:block;position:relative;z-index:1}
.card b{font-size:14.5px}
.card span{font-size:11.5px;color:var(--m)}
.card .wm{position:absolute;right:-4px;bottom:-12px;font-size:56px;font-style:normal;opacity:.08;pointer-events:none}
.card.feature,.card.wide{grid-column:span 2;display:flex;align-items:center;gap:15px;text-align:left;padding:17px 16px;color:#fff;border:0}
.card.feature{background:linear-gradient(120deg,#0f9d58,#1a8fe0 62%,#1a73e8);box-shadow:0 14px 30px rgba(26,115,232,.36)}
.card.wide{background:linear-gradient(120deg,#3949ab,#1976d2 60%,#0f9d58);box-shadow:0 12px 26px rgba(57,73,171,.3)}
.card.feature::before{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 4.6s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.card.feature::after,.card.wide::after{display:none}
.card.feature .ico,.card.wide .ico{width:64px;height:64px;margin:0;flex:none;background:rgba(255,255,255,.2);border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.card.feature .ico{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.card.feature b,.card.wide b{font-size:18px}
.card.feature span,.card.wide span{color:#e6f7ee;font-size:12.5px}
.card .tx{min-width:0}
.grid.sub .card:last-child:nth-child(odd){grid-column:span 2}
.foot{text-align:center;padding:26px 20px 8px;color:var(--m);font-size:12.5px;line-height:1.9}
/* ===== ভেতরের পেজ ===== */
.page{padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(120deg,var(--g),#0b9b86 50%,var(--b));color:#fff;position:sticky;top:0;z-index:6;border-radius:0 0 22px 22px;box-shadow:0 8px 22px rgba(10,100,80,.25)}
.top button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:12px;padding:6px 13px;font-size:18px}
.top h3{font-size:17px;display:flex;align-items:center;gap:8px}
.item{background:#fff;border-radius:20px;padding:15px 15px 15px 17px;margin-top:13px;box-shadow:0 6px 18px rgba(16,100,70,.09);border-left:5px solid var(--g2);animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.item:nth-child(even){border-left-color:var(--b2)}
.item h4{font-size:16.5px;margin-bottom:4px}
.item p{font-size:13px;color:var(--m);margin-top:2px;line-height:1.6}
.tag{display:inline-block;background:linear-gradient(135deg,#e2f6ec,#d3f1e1);color:var(--gd);border-radius:20px;padding:4px 11px;font-size:12px;margin:7px 6px 0 0}
.tag.blue{background:linear-gradient(135deg,#e6f0ff,#d6e6ff);color:var(--b)}
.call{display:inline-block;margin-top:11px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;text-decoration:none;border:0;border-radius:12px;padding:9px 15px;font-size:14px;box-shadow:0 6px 14px rgba(26,115,232,.28)}
.note{background:#fff8e1;border-radius:14px;padding:11px 13px;font-size:12.5px;line-height:1.65;margin:13px 0 0;color:#6d5600;border:1px solid #ffecb3}
.empty{text-align:center;color:var(--m);padding:44px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.chip{border:1px solid #cfe7da;background:#fff;border-radius:20px;padding:7px 15px;font-size:13px;white-space:nowrap;transition:.2s}
.chip.on{background:linear-gradient(135deg,var(--g),var(--b));color:#fff;border-color:transparent;box-shadow:0 5px 12px rgba(26,115,232,.28)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#fff;border-radius:18px;padding:13px 6px;text-align:center;box-shadow:0 6px 16px rgba(16,100,70,.09);animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.stat b{display:block;font-size:21px;font-weight:800;background:linear-gradient(135deg,var(--g),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;color:var(--m)}
/* ===== ফর্ম ===== */
.f label{display:block;font-size:13px;margin:13px 0 5px;color:var(--m)}
.f input,.f select,.f textarea{width:100%;border:1.5px solid #d3e8dc;border-radius:14px;padding:13px;font:inherit;font-size:15px;background:#fff;outline:0;transition:.2s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--b2);box-shadow:0 0 0 4px rgba(61,139,255,.16)}
.f textarea{min-height:92px}
.chk{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:13px;line-height:1.6}
.f .chk{display:flex}
.f .chk input,.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.f .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;padding:0;border:0}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0;border-radius:16px;padding:15px;font-size:16.5px;font-weight:600;margin-top:16px;box-shadow:0 10px 22px rgba(15,157,88,.32);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.alt{background:linear-gradient(135deg,var(--b),var(--b2));box-shadow:0 10px 22px rgba(26,115,232,.3);margin-top:12px}
.btn.dng{background:linear-gradient(135deg,#e53935,#c62828);box-shadow:0 10px 22px rgba(198,40,40,.3)}
.del{background:#fdecea;color:#c62828;border:0;border-radius:12px;padding:9px 14px;font-size:14px;margin-top:10px}
.err{color:#c62828;font-size:13px;margin-top:10px;min-height:18px;line-height:1.6}
.lnk{background:none;border:0;color:var(--b);font-size:13.5px;padding:6px 2px;text-decoration:underline}
/* ===== অ্যাকাউন্ট ===== */
.auth{max-width:460px;margin:0 auto;padding:0 16px 10px}
.authhero{text-align:center;color:#fff;padding:26px 18px 56px;margin:0 -16px;background:linear-gradient(125deg,#00b36a,#0b9b86 45%,#1565d8);border-radius:0 0 30px 30px}
.authhero .logo{margin:0 auto 10px;width:64px;height:64px}
.authhero h3{font-size:20px;margin-bottom:6px}
.authhero p{font-size:13.5px;opacity:.96;line-height:1.65}
.authcard{background:#fff;border-radius:26px;padding:20px 18px 22px;margin-top:-34px;position:relative;box-shadow:0 16px 40px rgba(10,80,70,.18)}
.authcard.center{text-align:center;margin-top:18px}
.authcard h3{font-size:18px;margin:6px 0}
.authcard p{font-size:13.5px;color:var(--m);line-height:1.7}
.bigico{font-size:46px}
.tabs{display:flex;background:#edf6f1;border-radius:16px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font-weight:600;color:var(--m)}
.tabs button.on{background:#fff;color:var(--gd);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.pwbox{position:relative}
.pwbox input{padding-right:50px!important}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:19px;padding:9px}
.meter{display:flex;gap:5px;margin-top:9px}
.meter i{flex:1;height:5px;border-radius:4px;background:#e0ebe5;transition:.25s}
.meter.s1 i:nth-child(-n+1){background:#e53935}
.meter.s2 i:nth-child(-n+2){background:#fb8c00}
.meter.s3 i:nth-child(-n+3){background:#7cb342}
.meter.s4 i:nth-child(-n+4){background:#0f9d58}
.mtxt{font-size:12px;margin-top:5px;color:var(--m)}
.fine{font-size:12.5px;color:var(--m);text-align:center;margin:14px 6px;line-height:1.8}
.bigav{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--b));color:#fff;font-size:38px;font-weight:700;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 10px 24px rgba(26,115,232,.3)}
.vbadge{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:20px;font-size:12px;background:#e3f6ea;color:var(--gd)}
.vbadge.no{background:#fff1da;color:#b26a00}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#12281c;color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;z-index:99;box-shadow:0 10px 26px rgba(0,0,0,.3);animation:pop .3s;max-width:88vw;text-align:center}
@keyframes pop{from{opacity:0;bottom:80px}}
/* ===== নেভিগেশন ===== */
nav{position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 10px 34px rgba(10,60,40,.24),0 0 0 1px rgba(16,196,119,.14);z-index:9}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:20px;transition:.25s}
nav button i{font-style:normal;font-size:21px;transition:.25s}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--g),var(--b));box-shadow:0 6px 14px rgba(26,115,232,.35)}
nav button.on i{transform:translateY(-1px) scale(1.1)}
/* ===== ছবি, যোগাযোগ বাটন, সাংবাদিক ===== */
.chip-btn.ab{padding:6px 13px 6px 10px;gap:7px;line-height:1.2;font-size:12px;text-align:left}
.chip-btn .ai{font-size:19px}
.who{display:flex;gap:12px;align-items:center}
.wt{min-width:0;flex:1}
.pic{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px #fff,0 4px 12px rgba(16,100,70,.25);cursor:zoom-in;background:#e6f4ec}
.sub{color:var(--gd)!important;font-weight:600}
.chn{color:var(--b)!important;font-weight:600;display:flex;align-items:center;gap:6px}
.lg{width:22px;height:22px;border-radius:6px;object-fit:cover;flex:none}
.gal{display:flex;gap:8px;overflow-x:auto;margin-top:11px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{height:136px;width:auto;max-width:80%;border-radius:14px;object-fit:cover;scroll-snap-align:start;flex:none;cursor:zoom-in;background:#e6f4ec}
.ul{margin:9px 0 0 20px;font-size:13.5px;line-height:1.7}
.cbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.cbar .call,.cbar .del{margin-top:0}
.call.wa{background:linear-gradient(135deg,#25d366,#1ebe57);box-shadow:0 6px 14px rgba(37,211,102,.3)}
.pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pickbtn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border:0;border-radius:14px;padding:11px 15px;font-size:14px;box-shadow:0 6px 14px rgba(26,115,232,.28)}
.pickhint{font-size:12px;color:var(--m)}
.pickst{font-size:13px;color:#c62828;margin-top:6px;min-height:0}
.pickst:empty{display:none}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.th{position:relative;width:76px;height:76px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.th button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:#c62828;color:#fff;font-size:12px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:8px}
.chstrip{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chstrip::-webkit-scrollbar{display:none}
.chb{flex:none;display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid #d3e8dc;border-radius:16px;padding:6px 12px 6px 7px;font-size:13px}
.chb img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.chb em{font-style:normal;font-size:20px;width:28px;text-align:center}
.chb.on{border-color:var(--b2);background:#eaf2ff;box-shadow:0 5px 12px rgba(26,115,232,.2)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:120;display:grid;place-items:center;animation:pop2 .2s}
.lb img{max-width:96vw;max-height:88vh;border-radius:12px}
@keyframes pop2{from{opacity:0}}
img.bigav{object-fit:cover;display:block}
/* কিবোর্ড খোলা থাকলে নিচের মেনু থাকে না */
body.typing nav{display:none}
body.typing{padding-bottom:28px}
/* ===== হ্যাঁ/না পর্দা ===== */
.dlg{position:fixed;inset:0;background:rgba(10,30,20,.52);display:none;place-items:center;z-index:130;padding:24px}
.dlg.on{display:grid}
.dbox{background:#fff;border-radius:22px;padding:24px 20px 20px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;animation:rise .25s}
.dbox p{font-size:17px;font-weight:600;line-height:1.55}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.drow .btn{margin-top:12px;padding:13px}
.btn.gry{background:#e8eeea;color:var(--t);box-shadow:none}
/* ===== শুরুর পর্দা (স্প্ল্যাশ) ===== */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 36%,#fff 0%,#eefaf3 52%,#dcefff 100%);transition:opacity .6s ease,visibility .6s;overflow:hidden;padding:0 20px}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-wrap{position:relative;width:min(80vw,350px)}
.sp-logo{position:relative;z-index:2;width:100%;display:block;mix-blend-mode:multiply;animation:spIn 1.2s cubic-bezier(.2,.9,.25,1.15) both,spFloat 4.2s ease-in-out 1.2s infinite}
@keyframes spIn{0%{opacity:0;transform:scale(.5) translateY(36px) rotate(-7deg);filter:blur(12px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes spFloat{50%{transform:translateY(-7px) scale(1.018)}}
.sp-rip{position:absolute;z-index:1;left:50%;top:42%;width:62%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(15,157,88,.4);transform:translate(-50%,-50%) scale(.5);opacity:0;animation:spRip 3s ease-out infinite 1s}
.sp-rip.r2{border-color:rgba(26,115,232,.35);animation-delay:1.7s}
.sp-rip.r3{animation-delay:2.4s}
@keyframes spRip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
.sp-name{margin-top:2px;font-size:25px;font-weight:700;background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:spName 1s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
@keyframes spName{from{opacity:0;transform:translateY(16px);letter-spacing:7px}to{opacity:1;transform:none;letter-spacing:.5px}}
.sp-bar{position:absolute;bottom:10vh;width:130px;height:4px;border-radius:4px;background:#d6e7dd;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--b));animation:spBar 3s ease-out forwards}
@keyframes spBar{to{width:100%}}
.sp-hint{position:absolute;bottom:5vh;font-size:12px;color:var(--m);opacity:0;animation:spName .6s ease 1.8s forwards}
.diag{white-space:pre-line;font-size:13px;line-height:1.7;background:#fff;border:1px solid #cfe5d5;border-radius:14px;padding:12px 14px;margin:8px 4px}
.diag:empty{display:none}
/* ===== সাজসজ্জা: নীল-সবুজ ধাঁচ, আরও উজ্জ্বল ও মসৃণ ===== */
:root{--pat:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-opacity%3D%22.2%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%2026h24l2%2022H10z%22%2F%3E%3Cpath%20d%3D%22M19%2026v-4a5%205%200%200%201%2010%200v4%22%2F%3E%3Cpath%20d%3D%22M70%2022h6l5%2018h24l4-15H78%22%2F%3E%3Ccircle%20cx%3D%2284%22%20cy%3D%2246%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22102%22%20cy%3D%2246%22%20r%3D%223%22%2F%3E%3Cpath%20d%3D%22M14%2072h22l16%2016-16%2016H14z%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2280%22%20r%3D%222.2%22%2F%3E%3Crect%20x%3D%2276%22%20y%3D%2284%22%20width%3D%2228%22%20height%3D%2220%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M76%2092h28M90%2084v20M90%2084c-7-9-14-3-8%200M90%2084c7-9%2014-3%208%200%22%2F%3E%3Cpath%20d%3D%22M52%2068l12-12%22%2F%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%2258%22%20r%3D%222%22%2F%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%2266%22%20r%3D%222%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}
body{background:radial-gradient(circle at 8% 0%,rgba(16,196,119,.16),transparent 38%),radial-gradient(circle at 100% 18%,rgba(26,115,232,.13),transparent 40%),linear-gradient(180deg,#e4f6ee 0%,#eef6ff 55%,#fff 100%) fixed}
.hero{box-shadow:0 20px 44px rgba(10,90,120,.3)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 22%,rgba(255,255,255,.2),transparent 38%);z-index:2;pointer-events:none}
.search{border-radius:22px;box-shadow:0 14px 34px rgba(10,90,80,.2),0 0 0 1px rgba(16,196,119,.16)}
.q i{background:var(--qb,#fff);box-shadow:0 8px 18px rgba(16,100,70,.16),inset 0 0 0 2px rgba(255,255,255,.9)}
.q.sos i{background:linear-gradient(135deg,#ff5a5a,#d32f2f)}
.ribbon{background:linear-gradient(180deg,#fff,#f6fcfa);box-shadow:0 10px 26px rgba(16,100,90,.12)}
.join{background:linear-gradient(120deg,#0b9b5a,#0aa0a6 55%,#1a73e8);box-shadow:0 14px 28px rgba(20,110,170,.32);position:relative;overflow:hidden}
.join::after{content:"";position:absolute;right:-34px;top:-44px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.join>*{position:relative;z-index:1}
.card{background:linear-gradient(180deg,#fff 0%,#f5fbf8 100%);border:1px solid rgba(16,196,119,.12);box-shadow:0 10px 24px rgba(16,100,90,.1),inset 0 1px 0 #fff}
.ico{background:linear-gradient(145deg,var(--c,#e6f4ec),#fff);box-shadow:0 6px 14px rgba(0,0,0,.07),inset 0 1px 0 #fff}
.card.wide{background:linear-gradient(120deg,#3949ab,#1976d2 55%,#0aa07a)}
.item{box-shadow:0 8px 20px rgba(16,100,90,.1)}
.top{background:linear-gradient(120deg,#0b9b5a,#0aa0a6 52%,#1a73e8)}
.btn{background:linear-gradient(135deg,#0b9b5a,#10c477);box-shadow:0 10px 22px rgba(15,157,88,.34),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.alt{background:linear-gradient(135deg,#1a73e8,#3d8bff);box-shadow:0 10px 22px rgba(26,115,232,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.dng{background:linear-gradient(135deg,#e53935,#c62828);box-shadow:0 10px 22px rgba(198,40,40,.3)}
.btn.gry{background:#e8eeea;color:var(--t);box-shadow:none}
.call{box-shadow:0 6px 14px rgba(26,115,232,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.call.wa{box-shadow:0 6px 14px rgba(37,211,102,.3),inset 0 1px 0 rgba(255,255,255,.3)}
nav{background:rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(10,60,70,.26),0 0 0 1px rgba(16,196,119,.16)}
nav button.on{background:linear-gradient(135deg,#0b9b5a,#1a73e8);box-shadow:0 8px 16px rgba(26,115,232,.4)}
h2::before{background:linear-gradient(#10c477,#1a73e8)}
/* ক্রয়-বিক্রয়: কেনাকাটার আমেজ */
.card.feature,.mkban{background:var(--pat) 0 0/120px 120px,radial-gradient(circle at 90% 10%,rgba(255,213,79,.6),transparent 36%),linear-gradient(120deg,#0b9b5a,#0aa6a0 45%,#1a8fe0 80%,#1a73e8)}
.card.feature{box-shadow:0 14px 30px rgba(20,120,170,.4);animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards,mkdrift 28s linear infinite;animation-delay:calc(var(--i,0)*45ms),0s}
@keyframes mkdrift{to{background-position:120px 120px,0 0,0 0}}
.card.feature .ico{background:rgba(255,255,255,.22);width:68px;height:68px}
.card.feature .tx{max-width:calc(100% - 150px)}
.fl{position:absolute;font-style:normal;z-index:1;animation:flt 5s ease-in-out infinite}
.fl.f1{right:16px;top:12px;width:34px;height:34px;border-radius:50%;background:#ffd54f;color:#7a4a00;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.fl.f2{right:20px;bottom:10px;font-size:26px;animation-delay:-1.6s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.fl.f3{right:62px;top:14px;font-size:20px;animation-delay:-3s;opacity:.92}
@keyframes flt{50%{transform:translateY(-6px) rotate(6deg)}}
.mkban{position:relative;overflow:hidden;margin:14px 16px 0;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;color:#fff;box-shadow:0 12px 26px rgba(20,120,170,.32)}
.mkban b{display:block;font-size:16.5px}
.mkban span{font-size:12.5px;opacity:.95}
.mkl{width:66px;height:66px;flex:none;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.mkban .fl.f1{width:30px;height:30px;font-size:16px;top:10px}
.mkban .fl.f2{font-size:22px;bottom:8px}
/* ===== কুইজ ===== */
.qzhero{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#6a3fb5,#1a73e8 60%,#0aa0a6);color:#fff;border-radius:22px;padding:18px;margin:12px 0 14px;box-shadow:0 12px 26px rgba(70,70,180,.3);position:relative;overflow:hidden}
.qzhero b{display:block;font-size:18px}
.qzhero span{font-size:13px;opacity:.95;line-height:1.6;display:block;margin-top:2px}
.qzhero i{font-style:normal;font-size:46px;margin-left:auto;animation:flt 4s ease-in-out infinite}
.qzl{display:grid;gap:12px;margin-top:10px}
.card.qzc{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;width:100%}
.card.qzc .ico{margin:0;flex:none}
.qzb{display:block;font-style:normal;font-size:12.5px;color:#b26a00;margin-top:3px;font-weight:600}
.qzp{margin-top:12px}
.qzbar{height:8px;border-radius:8px;background:#dbece2;overflow:hidden}
.qzbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#10c477,#1a73e8);transition:width .4s}
.qzmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--m);margin-top:6px;font-weight:600}
.qzq{font-size:19px;font-weight:700;line-height:1.55;margin:14px 2px 6px}
.qzo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #d3e8dc;border-radius:16px;padding:13px 14px;margin-top:11px;font-size:16px;box-shadow:0 6px 16px rgba(16,100,90,.08);transition:.2s;animation:rise .4s backwards}
.qzo b{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e8f4ee;color:var(--gd);font-size:15px}
.qzo span{flex:1;line-height:1.5}
.qzo em{font-style:normal;font-size:20px;font-weight:800}
.qzo:not(:disabled):active{transform:scale(.98);border-color:var(--b2)}
.qzo.ok{background:#e3f8ea;border-color:#0f9d58}
.qzo.ok b{background:#0f9d58;color:#fff}
.qzo.ok em{color:#0f9d58}
.qzo.bad{background:#fdecea;border-color:#e53935;animation:shake .35s}
.qzo.bad b{background:#e53935;color:#fff}
.qzo.bad em{color:#e53935}
.qzo.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qzfb{border-radius:16px;padding:13px 15px;margin-top:14px;font-size:15px;line-height:1.7;animation:rise .35s}
.qzfb.g{background:#e3f8ea;color:#0a6b3a}
.qzfb.r{background:#fdecea;color:#a12622}
.qzfb p{font-size:13.5px;margin-top:4px;color:var(--t)}
.qzres{text-align:center;padding:18px 0 4px}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:grid;place-content:center;background:conic-gradient(#10c477 calc(var(--p)*1%),#e1ece5 0);position:relative;box-shadow:0 12px 28px rgba(16,100,90,.2)}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.ring b,.ring span{position:relative;text-align:center}
.ring b{font-size:28px;font-weight:800;color:var(--gd)}
.ring span{font-size:14px;color:var(--m)}
.qzres h3{font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash .sp-name,#splash .sp-hint{opacity:1!important}.sp-rip{display:none}.sp-bar i{width:100%}}
</style>
</head>

/* ================= ছবি, যোগাযোগ বাটন, কিবোর্ড ================= */
const IMG_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const FILE_RE=/^[\w][\w./-]*\.(jpe?g|png|webp)$/i;
const safeImg=s=>typeof s==="string"&&(IMG_RE.test(s)||(FILE_RE.test(s)&&!s.includes("..")))?s:"";
const waNum=n=>/^01\d{9}$/.test(n||"")?"88"+n:"";
const PHONE_RE=/^01\d{9}$/;

/* ছবি ছোট করে JPEG বানায়: সাইজ কমে, আর ছবির ভেতরের লোকেশন (GPS) তথ্য মুছে যায় */
const readURL=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("READ"));fr.onload=()=>res(fr.result);fr.readAsDataURL(f);});
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onerror=()=>rej(new Error("DECODE"));im.onload=()=>res(im);im.src=src;});
/* বড় ক্যামেরা-ছবিও (৫০–২০০ মেগাপিক্সেল) যেন ফোনের মেমরিতে আটকে না যায়, তাই আগে সরাসরি ছোট করে খোলার চেষ্টা */
async function decodeImg(file,max){
  const wrap=b=>({el:b,w:b.width,h:b.height,done:()=>{try{b.close();}catch(e){}}});
  if(typeof createImageBitmap==="function"){
    try{return wrap(await createImageBitmap(file,{imageOrientation:"from-image"}));}catch(e){}
    try{return wrap(await createImageBitmap(file,{resizeWidth:max,resizeQuality:"high",imageOrientation:"from-image"}));}catch(e){}
  }
  const im=await loadImg(await readURL(file));
  return {el:im,w:im.naturalWidth||im.width,h:im.naturalHeight||im.height,done(){}};
}
async function shrink(file,max,q){
  if(!file) throw new Error("NOTIMG");
  const t=file.type||"";
  if(t&&!/^image\//.test(t)&&t!=="application/octet-stream") throw new Error("NOTIMG");
  if(file.size>40*1024*1024) throw new Error("BIG");
  let d;
  try{d=await decodeImg(file,max);}
  catch(e){throw new Error(/heic|heif/i.test(t+" "+(file.name||""))?"HEIC":"DECODE");}
  const k=Math.min(1,max/Math.max(d.w,d.h));
  const w=Math.max(1,Math.round(d.w*k)),h=Math.max(1,Math.round(d.h*k));
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(d.el,0,0,w,h);d.done();
  const out=c.toDataURL("image/jpeg",q);
  if(!/^data:image\/jpeg;base64,/.test(out)) throw new Error("DECODE");
  return out;
}
const PICK={};
const PICK_MSG={NOTIMG:"এটি ছবি নয়। JPG বা PNG ছবি বাছুন।",BIG:"ছবিটি অনেক বড় (৪০ MB-এর বেশি)।",HEIC:"এই ছবির ফরম্যাট (HEIC) খোলা যাচ্ছে না। অন্য ছবি দিন বা ক্যামেরায় JPG ফরম্যাট বেছে নিন।",DECODE:"ছবিটি খোলা যাচ্ছে না। অন্য একটি ছবি বাছুন।",READ:"ছবিটি পড়া যাচ্ছে না। আবার চেষ্টা করুন।"};
function photoField(id,max,label,hint,init){
  PICK[id]=init?[init]:[];
  return `<label>${label}</label><div class="pick"><button type="button" class="pickbtn" onclick="this.nextElementSibling.click()">📷 ছবি বাছুন${max>1?" (সর্বোচ্চ "+bn(max)+"টি)":""}</button><input type="file" accept="image/*" ${max>1?"multiple":""} onchange="pickPhotos('${id}',${max},this)" hidden><span class="pickhint">${hint||""}</span></div><div class="pickst" id="${id}_s" role="status"></div><div class="thumbs" id="${id}_t"></div>`;
}
async function pickPhotos(id,max,inp){
  const files=[...inp.files];inp.value="";
  const st=document.getElementById(id+"_s"),say=m=>{if(st) st.textContent=m;};
  if(!files.length) return;
  say("⏳ ছবি প্রস্তুত হচ্ছে…");let bad="";
  for(const f of files){
    if(max>1&&PICK[id].length>=max){bad="সর্বোচ্চ "+bn(max)+"টি ছবি দেওয়া যাবে।";break;}
    try{
      const out=await shrink(f,max>1?900:640,.72);
      if(max===1) PICK[id]=[out];else PICK[id].push(out);   // এক ছবির ঘরে নতুন ছবি ঠিকমতো এলে তবেই পুরনোটা বদলায়
      renderThumbs(id);
    }catch(e){bad=PICK_MSG[e.message]||PICK_MSG.DECODE;}
  }
  renderThumbs(id);say(bad);if(bad) toast(bad);
}
function renderThumbs(id){
  const t=document.getElementById(id+"_t");if(!t) return;
  t.innerHTML=(PICK[id]||[]).map((s,i)=>`<div class="th"><img src="${safeImg(s)}" alt=""><button type="button" onclick="rmPhoto('${id}',${i})" aria-label="ছবি সরান">✕</button></div>`).join("");
}
function rmPhoto(id,i){PICK[id].splice(i,1);renderThumbs(id);}

function contactHTML(it){
  const hasPh=!!it.ph,hasWa=!!waNum(it.wa);

if(typeof document.addEventListener==="function"){
  document.addEventListener("click",e=>{
    const t=e.target;
    if(t&&t.tagName==="IMG"&&t.classList&&(t.classList.contains("pic")||t.closest&&t.closest(".gal"))) showImg(t.getAttribute("src"));
  });
  /* কিবোর্ড খুললে নিচের মেনু লুকিয়ে যায়, তাই লেখার সময় কিবোর্ডের উপরে কিছু ভাসে না */
  const isText=el=>!!el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName||"")&&!/^(checkbox|radio|file|button|submit|range|color)$/.test(el.type||"");
  const setTyping=on=>{const b=document.body;if(b&&b.classList) b.classList.toggle("typing",!!on);};
  document.addEventListener("focusin",e=>{if(isText(e.target)) setTyping(true);});
  document.addEventListener("focusout",()=>setTimeout(()=>setTyping(isText(document.activeElement)),80));
  if(window.visualViewport){
    visualViewport.addEventListener("resize",()=>{
      if(visualViewport.height<window.innerHeight*0.78) setTyping(true);
      else if(!isText(document.activeElement)) setTyping(false);
    });
  }
}

function wavePath(y,a,per,fill,cls,op){

function countUp(){
  if(typeof requestAnimationFrame!=="function") return;

    requestAnimationFrame(step);
  });
}

const FB={
  demo:false,
  async post(url,body,form){
    let r;
    try{r=await fetch(url,{method:"POST",headers:{"Content-Type":form?"application/x-www-form-urlencoded":"application/json"},body:form?body:JSON.stringify(body),credentials:"omit",cache:"no-store"});}
    catch(e){throw new Error("NETWORK");}
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok) throw new Error((j&&j.error&&j.error.message)||"UNKNOWN");
    return j;
  },
  api(path,body){return this.post("https://identitytoolkit.googleapis.com/v1/"+path+"?key="+encodeURIComponent(FIREBASE.apiKey),body);},
  tokens(j,extra){return Object.assign({idToken:j.idToken||j.id_token,refreshToken:j.refreshToken||j.refresh_token,uid:j.localId||j.user_id,exp:Date.now()+((+(j.expiresIn||j.expires_in)||3600)-60)*1000},extra||{});},
  async profile(s){
    const j=await this.api("accounts:lookup",{idToken:s.idToken});
    const u=(j.users||[])[0]||{};
    s.email=u.email||s.email;s.name=u.displayName||s.name||"";s.verified=!!u.emailVerified;
    return s;
  },
  async signUp(name,email,pw){
    const j=await this.api("accounts:signUp",{email,password:pw,returnSecureToken:true});
    const s=this.tokens(j,{email,name,verified:false});
    try{await this.api("accounts:update",{idToken:s.idToken,displayName:name,returnSecureToken:false});}catch(e){}
    try{await this.api("accounts:sendOobCode",{requestType:"VERIFY_EMAIL",idToken:s.idToken});}catch(e){s.mailFailed=true;}
    return s;
  },

    return this.profile(this.tokens(j,{email}));
  },
  async refresh(s){
    const j=await this.post("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(FIREBASE.apiKey),"grant_type=refresh_token&refresh_token="+encodeURIComponent(s.refreshToken),true);

  },
  async fresh(s){if(!s.idToken||Date.now()>=s.exp) await this.refresh(s);return s;},
  async restore(saved){
    const s={refreshToken:saved.rt,email:saved.email,name:saved.name,verified:!!saved.verified};
    await this.refresh(s);return this.profile(s);
  },
  async reload(s){await this.fresh(s);return this.profile(s);},
  async sendVerify(s){await this.fresh(s);await this.api("accounts:sendOobCode",{requestType:"VERIFY_EMAIL",idToken:s.idToken});},
  // ইমেইল আছে কি না ফাঁস না করতে "পাওয়া যায়নি" ত্রুটি চেপে যাওয়া হয়
  async sendReset(email){try{await this.api("accounts:sendOobCode",{requestType:"PASSWORD_RESET",email});}catch(e){if(!/EMAIL_NOT_FOUND/.test(e.message)) throw e;}},
  async remove(s,pw){const t=await this.signIn(s.email,pw);await this.api("accounts:delete",{idToken:t.idToken});}
};

/* ---------- ডেমো মোড: শুধু এই ফোনে, PBKDF2 দিয়ে হ্যাশ করা পাসওয়ার্ড ---------- */
const DEMO={
  demo:true,
  users(){try{return JSON.parse(localStorage.getItem("cc_demo_users")||"{}");}catch(e){return {};}},
  put(u){if(!lsSet("cc_demo_users",JSON.stringify(u))) throw new Error("STORAGE");},
  async hash(pw,salt){
    if(!globalThis.crypto||!crypto.subtle) throw new Error("CRYPTO");
    const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256));
  },
  async signUp(name,email,pw){
    const u=this.users();
    if(u[email]) throw new Error("EMAIL_EXISTS");
    const salt=crypto.getRandomValues(new Uint8Array(16));
    u[email]={name,salt:b64(salt),hash:await this.hash(pw,salt),uid:"d"+b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[^A-Za-z0-9]/g,"x")};
    this.put(u);
    return {uid:u[email].uid,email,name,verified:true,demo:true};
  },
  async signIn(email,pw){
    const r=this.users()[email];
    const salt=r?unb64(r.salt):crypto.getRandomValues(new Uint8Array(16));
    const h=await this.hash(pw,salt);               // ইমেইল না থাকলেও একই সময় লাগে
    if(!r||h!==r.hash) throw new Error("INVALID_LOGIN_CREDENTIALS");
    return {uid:r.uid,email,name:r.name,verified:true,demo:true};
  },
  async restore(saved){const r=this.users()[saved.email];return r?{uid:r.uid,email:saved.email,name:r.name,verified:true,demo:true}:null;},
  async reload(s){return s;},
  async sendVerify(){},
  async sendReset(){},
  async remove(s,pw){await this.signIn(s.email,pw);const u=this.users();delete u[s.email];this.put(u);}
};

function pwScore(pw){
  let s=0;
  if(pw.length>=8) s++;
  if(pw.length>=12) s++;
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw)) s++;
  if(/\d/.test(pw)&&/[^A-Za-z0-9]/.test(pw)) s++;
  return s;
}
function pwProblem(pw,email){
  if(pw.length<8) return "পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।";
  if(pw.length>64) return "পাসওয়ার্ড ৬৪ অক্ষরের বেশি হওয়া চলবে না।";
  if(!/[A-Za-z]/.test(pw)||!/\d/.test(pw)) return "পাসওয়ার্ডে অন্তত একটি ইংরেজি অক্ষর ও একটি সংখ্যা থাকতে হবে।";
  if(COMMON_PW.has(pw.toLowerCase())) return "এই পাসওয়ার্ডটি খুব সহজ। অন্য পাসওয়ার্ড দিন।";
  const local=(email||"").split("@")[0].toLowerCase();
  if(local.length>=4&&pw.toLowerCase().includes(local)) return "পাসওয়ার্ডে ইমেইলের অংশ রাখবেন না।";
  return "";
}
function lockLeft(){try{const o=JSON.parse(localStorage.getItem(LOCK)||"{}");return o.until>Date.now()?o.until-Date.now():0;}catch(e){return 0;}}
function noteFail(){
  try{
    const o=JSON.parse(localStorage.getItem(LOCK)||"{}");
    const n=(o.until>Date.now()?0:(o.n||0))+1;
    localStorage.setItem(LOCK,JSON.stringify(n>=5?{until:Date.now()+300000,n:0}:{n}));
  }catch(e){}
}
function authMsg(e){
  const m=String(e&&e.message||e);
  const T=[["EMAIL_EXISTS","এই ইমেইলে আগেই অ্যাকাউন্ট খোলা আছে। লগইন করুন।"],["WEAK_PASSWORD","পাসওয়ার্ড আরও শক্ত করুন।"],["INVALID_EMAIL","সঠিক ইমেইল ঠিকানা দিন।"],
    ["INVALID_LOGIN_CREDENTIALS","ইমেইল বা পাসওয়ার্ড সঠিক নয়।"],["INVALID_PASSWORD","ইমেইল বা পাসওয়ার্ড সঠিক নয়।"],["EMAIL_NOT_FOUND","ইমেইল বা পাসওয়ার্ড সঠিক নয়।"],
    ["USER_DISABLED","এই অ্যাকাউন্টটি বন্ধ করা হয়েছে।"],["TOO_MANY_ATTEMPTS","অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"],
    ["OPERATION_NOT_ALLOWED","ইমেইল-পাসওয়ার্ড লগইন চালু করা নেই (Firebase সেটিংস দেখুন)।"],["NETWORK","ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। (অ্যাপটি GitHub Pages-এর লিংকে খুলেছেন তো?)"],
    ["STORAGE","এই ব্রাউজারে তথ্য সংরক্ষণ করা যাচ্ছে না।"],["CRYPTO","নিরাপদ সংযোগ (https) ছাড়া অ্যাকাউন্ট খোলা যাবে না।"],
    ["TOKEN_EXPIRED","সেশনের মেয়াদ শেষ। আবার লগইন করুন।"],["INVALID_ID_TOKEN","সেশনের মেয়াদ শেষ। আবার লগইন করুন।"],
    ["CREDENTIAL_TOO_OLD","নিরাপত্তার জন্য আবার লগইন করুন।"]];
  for(const t of T) if(m.includes(t[0])) return t[1];
  if(/API key not valid|API_KEY_INVALID|INVALID_API_KEY/i.test(m)) return "Firebase কী (apiKey) ভুল। Firebase থেকে আবার কপি করে ফাইলে বসান।";
  if(/referer|REFERRER/i.test(m)) return "Firebase কী-এর ওয়েবসাইট সীমাবদ্ধতা এই ঠিকানার সাথে মিলছে না। Google Cloud-এ কী-এর Websites তালিকায় https://আপনার-ইউজারনেম.github.io/* দিন।";
  if(/API key|API_KEY|SERVICE_BLOCKED|PERMISSION_DENIED|blocked/i.test(m)) return "Firebase কী-এর অনুমতিতে সমস্যা। কী-এর API তালিকায় Identity Toolkit API ও Token Service API রাখুন, অথবা সীমাবদ্ধতা সাময়িক বন্ধ করুন।";
  return "কিছু একটা সমস্যা হয়েছে। একটু পরে আবার চেষ্টা করুন। (কোড: "+m.replace(/[^\w .:\-]/g,"").slice(0,60)+")";
}

  out.textContent="⏳ পরীক্ষা চলছে…";

  const r1=await run(()=>FB.api("accounts:signInWithPassword",{email:"diag@example.invalid",password:"diag-0000-x",returnSecureToken:false}));
  const r2=await run(()=>FB.post("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(FIREBASE.apiKey),"grant_type=refresh_token&refresh_token=diag",true));
  const good1=/EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|INVALID_EMAIL/.test(r1);

async function doSignup(ev){
  ev.preventDefault();
  const $=id=>document.getElementById(id),err=m=>{$("a_err").textContent=m;};
  if($("s_hp").value) return;                                    // বট ধরার ফাঁদ
  const name=$("s_name").value.replace(/<[^>]*>/g,"").replace(/[\u0000-\u001f<>]/g,"").trim().replace(/\s+/g," ");
  const email=$("s_email").value.trim().toLowerCase(),pw=$("s_pw").value,pw2=$("s_pw2").value;
  if(name&&(name.length<2||name.length>40)) return err("নাম ২ থেকে ৪০ অক্ষরের মধ্যে লিখুন।");
  if(!EMAIL_RE.test(email)||email.length>120) return err("সঠিক ইমেইল ঠিকানা দিন।");
  const pp=pwProblem(pw,email);if(pp) return err(pp);
  if(pw!==pw2) return err("দুটি পাসওয়ার্ড মিলছে না।");
  if(!$("s_ok").checked) return err("শর্ত ও গোপনীয়তা নীতিতে সম্মতি দিন।");
  err("");busy(true);
  try{

const MAP_RE=/^https:\/\/(www\.google\.com\/maps|maps\.google\.com|maps\.app\.goo\.gl|goo\.gl\/maps)(\/|\?|$)/;
const mySpots=()=>{try{return JSON.parse(localStorage.getItem("cc_spots")||"[]");}catch(e){return [];}};

function spotItem(x,mine){
  const it={...x};
  if(mine){it.mine=true;it.delfn="delSpot";it.tags=[...(x.tags||[]),"সদস্যের যোগ করা"];}
  if(x.mapurl&&MAP_RE.test(x.mapurl)){it.url=x.mapurl;it.ul="🧭 ম্যাপে দেখুন";}
  else if(!/^নমুনা/.test(x.t)) it.map=x.t+" "+x.s+" চাঁদপুর";
  return it;
}

    <p class="pickhint" style="margin-top:8px">অন্য জায়গা হলে Google Maps-এ স্থানটি খুঁজে Share চেপে লিংক কপি করুন, তারপর নিচে বসান। লিংক না দিলে নাম দিয়ে ম্যাপে খোঁজা হবে।</p>
    <input id="sp_map" type="url" inputmode="url" autocapitalize="none" maxlength="300" placeholder="https://maps.app.goo.gl/...">
    <p class="err" id="sp_err" role="alert"></p>
    <button class="btn" onclick="postSpot()">প্রকাশ করুন</button>
  </div>`;
  renderThumbs("spimg");window.scrollTo(0,0);
}
function spotHere(){
  if(!navigator.geolocation) return toast("এই ফোনে লোকেশন সুবিধা নেই");
  toast("অবস্থান খোঁজা হচ্ছে…");
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude.toFixed(6),lo=p.coords.longitude.toFixed(6);
    document.getElementById("sp_map").value="https://www.google.com/maps/search/?api=1&query="+la+","+lo;
    toast("অবস্থান বসানো হয়েছে ✓");
  },()=>toast("অবস্থান পাওয়া যায়নি। অনুমতি দিন অথবা Google Maps-এর লিংক বসান।"),{enableHighAccuracy:true,timeout:15000});
}
function postSpot(){
  if(!SES||!SES.verified) return needAuth(spotForm);
  const v=id=>document.getElementById(id).value.trim(),err=m=>{document.getElementById("sp_err").textContent=m;};
  const t=v("sp_t"),map=v("sp_map"),kind=v("sp_kind")==="park"?"park":"tour";
  if(t.length<3) return err("স্থানের নাম লিখুন।");
  if(map&&!MAP_RE.test(map)) return err("ম্যাপের লিংক Google Maps-এর হতে হবে (https://maps.app.goo.gl/... বা https://www.google.com/maps/...)।");
  const a=mySpots();
  a.unshift({id:Date.now(),kind,t,s:v("sp_s"),desc:v("sp_d"),imgs:PICK.spimg.slice(0,5),mapurl:map,tags:[kind==="park"?"পার্ক":"দর্শনীয় স্থান"]});
  if(!saveSpots(a.slice(0,30))) return err("সংরক্ষণ করা গেল না। ছবির কারণে স্টোরেজ ভরে গেছে হতে পারে। পুরনো তথ্য মুছুন বা কম ছবি দিন।");
  spotsPage(kind);
}
function delSpot(id){
  ask("এই স্থান মুছে ফেলবেন?",()=>{saveSpots(mySpots().filter(a=>a.id!==id));spotsPage(spKind);},true);
}

    <div class="qzhero"><div><b>জ্ঞান যাচাই করুন!</b><span>প্রতি প্রশ্নে ৩টি উত্তর, সঠিকটি বেছে নিন। বাছার সাথে সাথে সঠিক উত্তর চিহ্নিত হবে।</span></div><i>🧠</i></div>
    <button class="btn" onclick="quizStart('mix')">🎲 মিশ্র কুইজ (সব বিষয় থেকে ১০টি)</button>
    <h2 style="margin:20px 0 4px">বিষয় বাছুন</h2>
    <div class="qzl">${QUIZ.map(row).join("")}</div>
    <p class="fine">মোট ${bn(tot)}টি প্রশ্ন। প্রতিবার প্রশ্ন ও উত্তরের ক্রম এলোমেলো হয়।</p></div>`;
  window.scrollTo(0,0);
}
function quizStart(id){
  const t=quizTopic(id);if(!t) return;
  const pool=id==="mix"?QUIZ.flatMap(x=>x.q):t.q;
  const list=shuf(pool).slice(0,10).map(q=>({qs:q[0],ok:q[1],opts:shuf([q[1],q[2],q[3]]),ex:q[4]||""}));
  QZ={id,list,i:0,score:0,wrong:[],sel:-1};
  quizShow(true);
}
function quizShow(top){
  const z=QZ;if(!z) return quizHome();
  const q=z.list[z.i],tot=z.list.length,t=quizTopic(z.id),done=z.sel>=0,right=done&&q.opts[z.sel]===q.ok;
  app.innerHTML=`<div class="top"><button onclick="quizExit()" aria-label="কুইজ বন্ধ করুন">✕</button><h3>${t.i} ${t.n}</h3></div><div class="page">
    <div class="qzp"><div class="qzbar"><i style="width:${Math.round((z.i+(done?1:0))/tot*100)}%"></i></div><div class="qzmeta"><span>প্রশ্ন ${bn(z.i+1)}/${bn(tot)}</span><span>⭐ ${bn(z.score)}</span></div></div>
    <div class="qzq">${esc(q.qs)}</div>
    ${q.opts.map((o,k)=>{const cls=!done?"":o===q.ok?"ok":k===z.sel?"bad":"dim";return `<button class="qzo ${cls}" ${done?"disabled":""} onclick="quizPick(${k})"><b>${QL[k]}</b><span>${esc(o)}</span><em>${cls==="ok"?"✓":cls==="bad"?"✗":""}</em></button>`;}).join("")}
    ${done?`<div class="qzfb ${right?"g":"r"}">${right?"🎉 সঠিক উত্তর!":"❌ ভুল হয়েছে। সঠিক উত্তর: <b>"+esc(q.ok)+"</b>"}${q.ex?`<p>💡 ${esc(q.ex)}</p>`:""}</div><button class="btn" onclick="quizNext()">${z.i+1<tot?"পরের প্রশ্ন →":"ফলাফল দেখুন 🏁"}</button>`:""}
  </div>`;
  if(top) window.scrollTo(0,0);
}
function quizPick(k){
  const z=QZ;if(!z||z.sel>=0) return;
  const q=z.list[z.i];if(k<0||k>=q.opts.length) return;
  z.sel=k;
  if(q.opts[k]===q.ok) z.score++;else z.wrong.push({qs:q.qs,ok:q.ok,mine:q.opts[k],ex:q.ex});
  quizShow(false);
}
function quizNext(){
  const z=QZ;if(!z||z.sel<0) return;
  if(z.i+1>=z.list.length) return quizEnd();
  z.i++;z.sel=-1;quizShow(true);
}
function quizEnd(){
  const z=QZ,tot=z.list.length,pct=Math.round(z.score/tot*100),t=quizTopic(z.id);
  const st=quizStats(),old=st[z.id];
  const isBest=!old||z.score>old.best;
  if(isBest){st[z.id]={best:z.score,total:tot};try{localStorage.setItem("cc_quiz",JSON.stringify(st));}catch(e){}}
  const msg=pct>=90?"অসাধারণ! আপনি দারুণ জানেন 🏆":pct>=70?"খুব ভালো! 👏":pct>=50?"ভালো, আরও একটু চেষ্টা করুন 💪":"আরও পড়ুন ও আবার চেষ্টা করুন 📚";
  app.innerHTML=`<div class="top"><button onclick="quizHome()" aria-label="কুইজ তালিকা">←</button><h3>${t.i} ফলাফল</h3></div><div class="page">
    <div class="qzres"><div class="ring" style="--p:${pct}"><b>${bn(z.score)}/${bn(tot)}</b><span>${bn(pct)}%</span></div><h3>${msg}</h3>${isBest&&z.score>0?'<p class="qzb">🏅 নতুন সর্বোচ্চ স্কোর!</p>':""}</div>
    <button class="btn" onclick="quizStart('${z.id}')">🔁 আবার খেলুন</button>
    <button class="btn alt" onclick="quizHome()">📚 অন্য বিষয় বাছুন</button>
    ${z.wrong.length?`<h2 style="margin:22px 0 4px">ভুল উত্তরগুলো (${bn(z.wrong.length)}টি)</h2>${z.wrong.map(w=>`<div class="item"><h4>${esc(w.qs)}</h4><p>❌ আপনার উত্তর: ${esc(w.mine)}</p><p style="color:var(--gd);font-weight:600">✅ সঠিক উত্তর: ${esc(w.ok)}</p>${w.ex?`<p>💡 ${esc(w.ex)}</p>`:""}</div>`).join("")}`:'<div class="note">🎉 সবগুলো উত্তর সঠিক হয়েছে!</div>'}</div>`;
  window.scrollTo(0,0);
}
function quizExit(){
  if(!QZ||QZ.sel<0&&QZ.i===0) return quizHome();
  ask("কুইজ বন্ধ করবেন? এখনকার ফল হারিয়ে যাবে।",()=>{QZ=null;quizHome();},true);
}

  const ads=myAds();
  ads.unshift({id:Date.now(),t,s:v("a_s"),type,desc:v("a_d"),tags:["৳ "+price,type],imgs:PICK.aimg.slice(0,5),ph,wa,ok:document.getElementById("a_ok").checked});
  if(!saveAds(ads.slice(0,40))) return err("সংরক্ষণ করা গেল না। ছবির কারণে স্টোরেজ ভরে গেছে হতে পারে। পুরনো বিজ্ঞাপন মুছুন বা কম ছবি দিন।");
  mtype="সব";market();
}

function delAd(id){
  ask("বিজ্ঞাপনটি মুছে ফেলবেন?",()=>{
  saveAds(myAds().filter(a=>a.id!==id));
  market();
  },true);
}

function about(){
  const photo=safeImg(OWNER.photo);
  const initial=esc(OWNER.name.trim().charAt(0)||"চ");
  const wa=waNum(OWNER.whatsapp);
  let links="";
  if(PHONE_RE.test(OWNER.phone||"")) links+=`<a class="call" href="tel:${esc(OWNER.phone)}">📞 কল করুন</a>`;
  if(wa) links+=`<a class="call wa" href="https://wa.me/${wa}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>`;
  if(OWNER.email) links+=`<a class="call" href="mailto:${esc(OWNER.email)}">✉️ ইমেইল</a>`;
  if(/^https:\/\//.test(OWNER.facebook||"")) links+=`<a class="call" href="${esc(OWNER.facebook)}" target="_blank" rel="noopener noreferrer">🌐 ফেসবুক</a>`;
  app.innerHTML=`<div class="top"><button onclick="home()" aria-label="পিছনে">←</button><h3>ℹ️ আমাদের সম্পর্কে</h3></div>
  <div class="page"><div class="item" style="text-align:center;padding:24px 16px">
    ${photo?`<img class="bigav" src="${photo}" alt="">`:`<div class="bigav">${initial}</div>`}
    <h4 style="font-size:19px">${esc(OWNER.name)}</h4>
    <p>${esc(OWNER.role)}</p><p>📍 ${esc(OWNER.place)}</p>
    <p style="color:var(--t);margin-top:14px;line-height:1.7;font-size:14px">${esc(OWNER.bio)}</p>
    <div class="cbar" style="justify-content:center">${links}</div>
  </div>
  <div class="item"><h4>অ্যাপ সম্পর্কে</h4><p style="line-height:1.7">চাঁদপুর কানেক্ট একটি বিনামূল্যের স্থানীয় তথ্য ও কমিউনিটি অ্যাপ। ব্যক্তিগত তথ্য (যেমন ফোন নম্বর) সংশ্লিষ্ট সদস্যের সম্মতি ছাড়া প্রকাশ করা হয় না।</p></div></div>`;
  window.scrollTo(0,0);
}

function simple(title,icon,msg){
  app.innerHTML=`<div class="top"><button onclick="home()">←</button><h3>${icon} ${title}</h3></div><div class="page"><div class="empty">${msg}</div></div>`;
}
function setNav(k){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===k));}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  const k=b.dataset.go;
  if(k==="home") home();
  else if(k==="search"){home();document.getElementById("q").focus();}
  else if(k==="add") sellForm();
  else if(k==="me") SES?profilePage():authPage();
  setNav(k);
});
updateNav();
home();
restoreSession();
/* শুরুর পর্দা: চালু হলেই লোগো নড়েচড়ে দেখায়, কয়েক সেকেন্ড পর বা ট্যাপ করলে সরে যায় */
(function(){
  const sp=document.getElementById("splash");if(!sp) return;
  const n=document.getElementById("spname");if(n&&OWNER.name) n.textContent=OWNER.name;
  let done=false;
  const hide=()=>{if(done) return;done=true;sp.className="out";setTimeout(()=>sp.remove(),800);};
  sp.onclick=hide;setTimeout(hide,3200);
})();
</script>
